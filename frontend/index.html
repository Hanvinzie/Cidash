<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F6F8" />
    <meta
      name="description"
      content="Cidash - social gamified fitness tracker app"
    />
    <meta name="application-name" content="Cidash" />
    <meta name="color-scheme" content="light dark" />
    <!-- Domain canonical: semua URL *.vercel.app dialihkan 301 ke sini (lihat vercel.json). -->
    <link rel="canonical" href="https://cidash.hanvinzie.com/" />

    <!-- Open Graph / Twitter: pratinjau saat tautan dibagikan -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cidash" />
    <meta property="og:title" content="Cidash — Social Gamified Fitness" />
    <meta
      property="og:description"
      content="Run and ride with your circle. Take on Bomb Missions, climb the leaderboard, and share your routes."
    />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta property="og:url" content="https://cidash.hanvinzie.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Cidash — Social Gamified Fitness" />
    <meta name="twitter:image" content="/pwa-512x512.png" />
    <!-- Mode standalone (tanpa address bar / toolbar browser) saat dipasang di Home Screen -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cidash" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Cidash - Social Gamified Fitness Tracker</title>

    <!-- Terapkan tema sebelum render agar tidak berkedip (lihat store/ThemeContext.tsx). -->
    <script>
      (function () {
        // iOS: biarkan efek pantul native (header & nav fixed, jadi tidak ikut tertarik).
        if (/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.userAgent.indexOf('Mac') > -1 && navigator.maxTouchPoints > 1)) {
          document.documentElement.classList.add('ios');
        }
        // Palet tema (data-theme) dipasang sebelum render; id tak dikenal otomatis memakai tema bawaan di CSS.
        var themeId = localStorage.getItem('cidash_theme_id');
        if (themeId) document.documentElement.setAttribute('data-theme', themeId);
        var t = localStorage.getItem('cidash_theme');
        var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0B0F17');
        }
      })();
    </script>

    <!-- Boot splash + animasi pelari. Kelas .runner juga dipakai komponen RunnerLoader. -->
    <style>
      /* Rubik One untuk wordmark splash. Didaftarkan di sini (bukan di index.css) karena splash tampil lebih dulu. */
      @font-face {
        font-family: 'Rubik One';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('/fonts/rubik-one-latin-400.woff2') format('woff2');
      }
      html, body { margin: 0; background: #f6f6f8; }
      html.dark, html.dark body { background: #0b0f17; }
      #boot {
        position: fixed; inset: 0; z-index: 2000;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #f6f6f8; color: #ea2845;
        font-family: 'Plus Jakarta Sans Variable', system-ui, -apple-system, sans-serif;
        transition: opacity 0.3s ease;
      }
      html.dark #boot { background: #0b0f17; }
      #boot.hide { opacity: 0; pointer-events: none; }
      #boot-msg { margin: 0; min-height: 18px; max-width: 270px; text-align: center; line-height: 1.45; font-size: 13px; font-weight: 600; color: #6b7280; }
      html.dark #boot-msg { color: #7a879c; }
      #boot-msg.boot-msg-in { animation: boot-msg-in 0.38s ease-out both; }

      /* Logo: tile "C" pop-in + kilau, wordmark naik perlahan. Jarak ke stickman dibuat lega. */
      .boot-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 34px; }
      .boot-logo {
        width: 56px; height: 56px; border-radius: 8px;
        animation: boot-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both, boot-breathe 2s ease-in-out 0.8s infinite;
      }
      /* Logo secondary (tile merah) untuk latar terang, primary (tile terang) untuk latar gelap. */
      .boot-logo.on-dark { display: none; }
      html.dark .boot-logo.on-light { display: none; }
      html.dark .boot-logo.on-dark { display: block; }
      .boot-word {
        font-family: 'Rubik One', system-ui, sans-serif;
        font-size: 30px; font-weight: 400; letter-spacing: 1px; text-transform: uppercase; color: #111827;
        animation: boot-rise 0.5s ease-out 0.25s both;
      }
      html.dark .boot-word { color: #f8fafc; }
      @keyframes boot-pop { from { transform: scale(0.4) rotate(-12deg); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes boot-breathe { 50% { transform: scale(1.06); } }
      @keyframes boot-rise { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes boot-msg-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .boot-logo, .boot-word, #boot-msg { animation: none !important; } }

      /* Panggung stickman: halo lembut + bayangan yang ikut berdenyut saat berlari. */
      .boot-stage { position: relative; display: grid; place-items: center; }
      .boot-stage::after {
        content: ''; position: absolute; bottom: -4px; width: 50px; height: 5px; border-radius: 9999px;
        background: rgba(17, 24, 39, 0.16); filter: blur(2px);
        animation: boot-shadow 0.6s ease-in-out infinite alternate;
      }
      html.dark .boot-stage::after { background: rgba(0, 0, 0, 0.55); }
      @keyframes boot-shadow { from { transform: scaleX(0.86); opacity: 0.5; } to { transform: scaleX(1); opacity: 0.9; } }
      /* Halo dipakai juga oleh RunnerLoader di dalam aplikasi. */
      .runner-halo { position: relative; display: grid; place-items: center; }
      .runner-halo::before {
        content: ''; position: absolute; inset: 6px; border-radius: 9999px;
        background: radial-gradient(circle, currentColor 0%, transparent 70%);
        opacity: 0.12; animation: runner-halo 2.4s ease-in-out infinite;
      }
      @keyframes runner-halo { 0%, 100% { transform: scale(0.92); opacity: 0.1; } 50% { transform: scale(1.08); opacity: 0.2; } }

      /* Bilah progres indeterminate: memberi sinyal "sedang memuat" tanpa angka palsu. */
      .boot-progress {
        position: relative; width: 140px; height: 4px; border-radius: 9999px; overflow: hidden;
        background: rgba(234, 40, 69, 0.13);
      }
      .boot-progress::after {
        content: ''; position: absolute; top: 0; bottom: 0; width: 45%; border-radius: inherit;
        background: linear-gradient(90deg, transparent, #ea2845 45%, #ff7a8a 60%, transparent);
        animation: boot-progress 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes boot-progress { from { transform: translateX(-120%); } to { transform: translateX(340%); } }
      @media (prefers-reduced-motion: reduce) { .boot-stage::after, .runner-halo::before, .boot-progress::after { animation: none !important; } }

      .runner { width: 88px; height: 88px; overflow: visible; }
      .runner .body { animation: runner-bob 0.3s ease-in-out infinite alternate; }
      .runner .limb { transform-box: view-box; animation: runner-swing 0.6s ease-in-out infinite alternate; }
      .runner .leg { transform-origin: 30px 38px; }
      .runner .arm { transform-origin: 34px 22px; }
      .runner .late { animation-delay: -0.6s; }
      .runner .ground { stroke-dasharray: 6 10; animation: runner-ground 0.45s linear infinite; }
      @keyframes runner-swing { from { transform: rotate(-34deg); } to { transform: rotate(34deg); } }
      @keyframes runner-bob { from { transform: translateY(0); } to { transform: translateY(-2px); } }
      @keyframes runner-ground { to { stroke-dashoffset: -16; } }
      @media (prefers-reduced-motion: reduce) { .runner * { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-brand" aria-label="Cidash">
        <img class="boot-logo on-light" src="/brand/logo-cidash-secondary.svg" width="56" height="56" alt="" />
        <img class="boot-logo on-dark" src="/brand/logo-cidash-primary.svg" width="56" height="56" alt="" />
        <span class="boot-word">CIDASH</span>
      </div>
      <div class="boot-stage runner-halo">
        <svg class="runner" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line class="ground" x1="4" y1="61" x2="60" y2="61" stroke-width="2" opacity="0.35" />
          <g class="body">
            <path class="limb arm" d="M34 22 L31 31 L37 34" opacity="0.45" />
            <path class="limb leg late" d="M30 38 L33 48 L29 57" opacity="0.45" />
            <line x1="35" y1="18" x2="30" y2="38" />
            <path class="limb leg" d="M30 38 L33 48 L29 57" />
            <path class="limb arm late" d="M34 22 L31 31 L37 34" />
            <circle cx="37" cy="10" r="5" fill="currentColor" stroke="none" />
          </g>
        </svg>
      </div>
      <div class="boot-progress" aria-hidden="true"></div>
      <p id="boot-msg"></p>
    </div>
    <script>
      (function () {
        var msgs = ['Lacing up your shoes…', 'Checking GPS signal…', 'Connecting to your circle…', 'Warming up…'];
        var el = document.getElementById('boot-msg');
        var i = Math.floor(Math.random() * msgs.length);
        var showMsg = function (text) {
          el.textContent = text;
          el.classList.remove('boot-msg-in');
          void el.offsetWidth; // paksa reflow agar animasi fade-in diputar ulang tiap ganti pesan
          el.classList.add('boot-msg-in');
        };
        showMsg(msgs[i]);
        var timer = setInterval(function () { i = (i + 1) % msgs.length; showMsg(msgs[i]); }, 2000);
        window.__hideBoot = function () {
          var boot = document.getElementById('boot');
          window.__hideBoot = null;
          // Tahan minimal 700 ms sejak halaman dibuka supaya animasi logo sempat selesai.
          setTimeout(function () {
            clearInterval(timer);
            if (!boot) return;
            boot.classList.add('hide');
            setTimeout(function () { boot.remove(); }, 320);
          }, Math.max(0, 700 - performance.now()));
        };
        // Pengaman: jangan pernah menutupi aplikasi lebih dari 8 detik.
        setTimeout(function () { if (window.__hideBoot) window.__hideBoot(); }, 8000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
